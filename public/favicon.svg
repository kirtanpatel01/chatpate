<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark Background Frame -->
  <rect width="64" height="64" fill="#07050a"/>
  
  <!-- Outer Electric Cyan Border -->
  <rect x="4" y="4" width="56" height="56" fill="none" stroke="#00f0ff" stroke-width="2"/>
  
  <!-- Sharp Geometric Pop-Art Play Triangle -->
  <polygon points="22,14 48,32 22,50" fill="#ff9f1c" stroke="#ff007f" stroke-width="2.5" stroke-linejoin="miter"/>
  
  <!-- Inner Offset Glow Triangle -->
  <polygon points="26,20 42,32 26,44" fill="none" stroke="#ffea00" stroke-width="1.5" stroke-linejoin="miter"/>
  
  <!-- Sharp Accent Sparkle -->
  <polygon points="50,12 52,16 56,18 52,20 50,24 48,20 44,18 48,16" fill="#00f0ff"/>
</svg>
